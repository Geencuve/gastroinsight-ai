{% extends "base.html" %}

{% block title %}Mis alertas | GastroInsight AI{% endblock %}

{% block content %}
<div class="waiter-app">
    <header class="waiter-head">
        <div>
            <h1>🔔 Mis alertas</h1>
            <p class="muted">Mesas que necesitan tu atención, ordenadas por urgencia.</p>
        </div>
        <div class="waiter-actions">{% if can_pair %}<a class="btn btn-secondary btn-small" href="{% url 'waiter:pair' %}">📱 Conectar celular</a>{% endif %}<button type="button" class="btn btn-secondary btn-small" id="sound-toggle">🔈 Sonido</button></div>
    </header>
    <div id="waiter-panel" data-url="{% url 'waiter:panel' %}">{% include "operations/_waiter_panel.html" %}</div>
</div>
<script>
    (function () {
        const panel = document.getElementById("waiter-panel");
        setInterval(async () => {
            const active = document.activeElement;
            if (active && active !== document.body && panel.contains(active)) return;
            try {
                const response = await fetch(panel.dataset.url, { credentials: "same-origin" });
                if (response.ok) panel.innerHTML = await response.text();
            } catch (error) { /* se reintenta */ }
        }, 6000);
    })();
</script>
{% endblock %}
