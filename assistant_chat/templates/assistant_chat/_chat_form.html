<form method="post" class="composer" action="{{ action }}" id="chat-form">
    {% csrf_token %}
    {% if venue_id %}<input type="hidden" name="venue_id" value="{{ venue_id }}">{% endif %}
    <label for="chat-message" class="visually-hidden">Tu mensaje</label>
    <textarea name="message" id="chat-message" rows="1" maxlength="600" required
              placeholder="{{ placeholder|default:'Escribe tu pregunta…' }}"></textarea>
    <button class="composer-send" type="submit" aria-label="Enviar" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
</form>
<script>
    (function () {
        const form = document.getElementById("chat-form");
        const box = document.getElementById("chat-message");
        const send = form.querySelector(".composer-send");
        const log = document.getElementById("chat-log");
        if (log) log.scrollTop = log.scrollHeight;
        const grow = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; send.disabled = !box.value.trim(); };
        box.addEventListener("input", grow);
        box.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                if (box.value.trim()) form.requestSubmit();
            }
        });
        document.querySelectorAll("[data-prompt]").forEach((button) => {
            button.addEventListener("click", () => { box.value = button.dataset.prompt; grow(); form.requestSubmit(); });
        });
        box.focus();
    })();
</script>
