<form method="post" class="assign-form">
    {% csrf_token %}
    <input type="hidden" name="accion" value="registrar">
    <input type="hidden" name="source" value="{{ source }}">
    <input type="text" name="name" value="{{ suggested }}" maxlength="100" aria-label="Nombre" required>
    <select name="venue" aria-label="Local">{% for v in venues %}<option value="{{ v.id }}">{{ v.name }}</option>{% endfor %}</select>
    <select name="uso" aria-label="Uso de la cámara">
        <option value="mesa">🪑 Mesa</option>
        <option value="entrada">🚶 Entrada</option>
        <option value="caja">💵 Caja</option>
    </select>
    <select name="table" aria-label="Mesa"><option value="">Mesa (si es de mesa)</option>{% for t in tables %}<option value="{{ t.id }}">{{ t.code }}{% if t.zone_name %} · {{ t.zone_name }}{% endif %}</option>{% endfor %}</select>
    <input type="text" name="zone" placeholder="Zona (opcional)" maxlength="80" aria-label="Zona">
    <button class="btn btn-primary btn-small" type="submit">Registrar y asignar</button>
</form>
